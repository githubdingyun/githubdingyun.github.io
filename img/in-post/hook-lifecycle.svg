<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>
  <text x="20" y="32" font-size="16" font-weight="700" fill="#1f2937">Hooks 挂在哪：一轮工具调用的生命周期</text>

  <text x="40" y="74" font-size="13" font-weight="600" fill="#475569">Agent 循环</text>
  <text x="460" y="74" font-size="13" font-weight="600" fill="#4f46e5">Hook 事件 · 插入时机</text>

  <!-- 左侧：循环阶段 -->
  <rect x="40" y="90" width="300" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="190" y="126" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">用户提问</text>

  <rect x="40" y="170" width="300" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="190" y="206" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">模型思考</text>

  <rect x="40" y="250" width="300" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="190" y="286" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">调用工具</text>

  <rect x="40" y="330" width="300" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="190" y="366" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">工具返回结果</text>

  <rect x="40" y="410" width="300" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="190" y="446" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">继续循环 / 收工</text>

  <line x1="190" y1="152" x2="190" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="190" y1="232" x2="190" y2="246" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="190" y1="312" x2="190" y2="326" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="190" y1="392" x2="190" y2="406" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 右侧：hook 事件 -->
  <line x1="344" y1="120" x2="452" y2="120" stroke="#8b8bf0" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="456" y="92" width="464" height="56" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="474" y="116" font-size="14" font-weight="600" fill="#3730a3">UserPromptSubmit</text>
  <text x="474" y="136" font-size="11.5" fill="#4f46e5">校验或补充用户提交的内容</text>

  <line x1="344" y1="280" x2="452" y2="280" stroke="#8b8bf0" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="456" y="252" width="464" height="56" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="474" y="276" font-size="14" font-weight="600" fill="#3730a3">PreToolUse</text>
  <text x="474" y="296" font-size="11.5" fill="#4f46e5">工具执行前拦截（delete-guard 就在这）</text>

  <line x1="344" y1="360" x2="452" y2="360" stroke="#8b8bf0" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="456" y="332" width="464" height="56" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="474" y="356" font-size="14" font-weight="600" fill="#3730a3">PostToolUse</text>
  <text x="474" y="376" font-size="11.5" fill="#4f46e5">工具成功后（test-on-edit 在这）</text>

  <line x1="344" y1="440" x2="452" y2="440" stroke="#8b8bf0" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="456" y="412" width="464" height="56" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="474" y="436" font-size="14" font-weight="600" fill="#3730a3">Stop</text>
  <text x="474" y="456" font-size="11.5" fill="#4f46e5">想收工时先验收，不过就不让停</text>

  <text x="20" y="502" font-size="12.5" fill="#475569">exit 0 = 放行（stdout 的 JSON 可表达决定）；exit 2 = 阻断，stderr 内容回灌给模型。</text>
</svg>
