# Site settings
title: Lsg's Blog
SEOTitle: Lsg's Blog | 定陨 的博客
header-img: img/home-bg.jpg
description: "Java,python,scala Coder and Big Data Engineer | 这里是 @DingYun ShuaiguoLi 的个人博客， 生活需要仪式感，💪。"
keyword: "ShuaiguoLi,LiShuaiguo,DingYun,dingyun,定陨的博客,@DingYun,spider, @DingYun的博客, 博客, 个人网站, 互联网"
baseurl: ""                             # for example, '/blog' if your blog hosted on 'host/blog'
url: "https://githubdingyun.github.io"               # 不要以 / 结尾：模板会再拼 page.url（以 / 开头），否则出现 //

# Publish posts or collection documents with a future date.

future: true
# SNS settings
# 已按隐私要求关闭整排社交图标（页脚 + 侧栏）。如需恢复：
#   1) 取消下面各项注释；2) 取消 _includes/footer.html 与 _includes/short-about.html 中 sns-links 的注释
# RSS: true
# weibo_username:     定陨
# zhihu_username:     dingyun
# github_username:    githubdingyun
# linkedin_username:  定陨
# twitter_username:   定陨
# facebook_username:  dingyun

description_footer: 来自定陨的个人专栏！



# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
# 注意：一旦自定义 exclude，Jekyll 的默认排除项会被覆盖，所以必须自己列全。
# CLAUDE.md / package-lock.json / book.postgres.backup 都没有 front matter，
# 不排除的话会被原样拷进 _site/，在站点根目录可以直接下载。
exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - package-lock.json
  - README.md
  - README.zh.md
  - CLAUDE.md
  - book.postgres.backup
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
timezone: CN

# Back to top 回到顶部by ray-eldath
b2t: true

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]



# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM                            # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1



# Disqus settings
# disqus_username: hux

# Netease settings
netease_comment: false

# Gitalk 评论：已停用并移除凭据。
# 原因：Gitalk 的 clientSecret 必须下发到浏览器，写在公开仓库里等于公开；
# 原 clientSecret 已泄露，请到 GitHub → Settings → Developer settings →
# OAuth Apps 删除/重置该 App。
# 如需恢复评论，建议改用无需 secret 的方案（giscus / utterances，基于 GitHub
# Discussions/Issues），或新建仅含 public_repo 权限的专用 OAuth App 后，
# 在此填入新的 clientID / clientSecret 并把 enable 改回 true。
gitalk:
   enable: false
   owner: githubdingyun
   repo: githubdingyun.github.io
   # clientID: <your-client-id>
   # clientSecret: <your-client-secret>
   admin: githubdingyun



# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]

# Google Analytics
# 已停用模板原作者 Hux 的属性 ID（UA-49627206-1），避免把本站访问计入他人账号。
# 填入你自己的属性 ID 后取消下一行注释即可恢复统计。
# ga_track_id: 'UA-XXXXXXXX-X'          # Format: UA-xxxxxx-xx
ga_domain: auto



# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: "Java 后端开发工程师 · 6 年经验<br>水利水电信息化 · AI 知识库 / 情报系统"
sidebar-avatar: /img/小埋0.png      # use absolute URL, seeing it's used in both `/` and `/about/`



# Featured Tags
featured-tags: true                     # whether or not using Feature-Tags
featured-condition-size: 1              # A tag will be featured if the size of it is more than this condition value



# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true



# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false



